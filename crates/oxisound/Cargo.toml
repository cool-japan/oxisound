[package]
name = "oxisound"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OxiSound — COOLJAPAN Pure-Rust audio device I/O facade"
categories = ["multimedia::audio"]
keywords = ["audio", "playback", "capture", "pure-rust", "cooljapan"]

[features]
default = ["pure"]
pure = ["dep:oxisound-cpal"]
tokio = ["dep:oxisound-cpal", "oxisound-cpal/tokio", "oxisound-core/tokio", "dep:futures-core", "dep:tokio-stream"]
midi = ["dep:oxisound-midi"]
smf = ["dep:oxisound-smf"]
oxiaudio = ["pure", "oxisound-core/oxiaudio"]
wasm = ["pure", "oxisound-cpal/wasm"]
osc = ["dep:oxisound-osc"]
# Opt-in, NOT in `default`. Pure-Rust PulseAudio native-protocol backend (also serves
# PipeWire through pipewire-pulse). On Linux it is the only backend with no C library in
# the audio path; on every other target `oxisound-pulse` compiles as a Pure-Rust stub, so
# enabling the feature never breaks a build. Making it the Linux default is a release
# decision and is deliberately left to the user.
pulse = ["dep:oxisound-pulse"]
# NOTE (Pure Rust Policy v2 §5): JACK support is NOT a facade feature. Native JACK
# (C-FFI/libjack2) lives in the `oxisound-jack` quarantine crate — apps that need it
# depend on `oxisound-jack` DIRECTLY. ASIO (Steinberg SDK, C++) likewise must live in
# its own `*-asio` quarantine crate (not yet created) — see TODO/follow-up.
# Enables the real AVAudioSession implementation on iOS / macOS via objc2-avf-audio.
# On all other platforms this feature is a no-op (stubs return appropriate errors).
session = ["dep:oxisound-session"]
# Convenience alias: macos-session enables the AVFoundation backend on Apple platforms.
macos-session = ["session", "oxisound-session/avf-audio"]

[dependencies]
oxisound-core = { workspace = true }
oxisound-cpal = { workspace = true, optional = true }
oxisound-midi = { workspace = true, optional = true }
oxisound-smf = { workspace = true, optional = true }
oxisound-osc = { workspace = true, optional = true }
oxisound-session = { workspace = true, optional = true }
oxisound-pulse = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
log = { workspace = true }

[dev-dependencies]
oxisound-core = { path = "../oxisound-core" }
oxiaudio = { workspace = true }
oxisound-smf = { path = "../oxisound-smf" }
tokio = { workspace = true, features = ["macros", "time", "rt", "net", "sync"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
criterion = { workspace = true }

[[example]]
name = "decode_play"
required-features = ["pure"]

[[example]]
name = "realtime_eq"
required-features = ["pure"]

[[example]]
name = "capture_encode"
required-features = ["pure"]

[[example]]
name = "async_monitor"
required-features = ["tokio"]

[[example]]
name = "ws_broadcast"
required-features = ["tokio"]

[[example]]
name = "play_midi"
required-features = ["smf", "midi"]

[[example]]
name = "smf_synth"
required-features = ["smf"]

[[example]]
name = "osc_bridge"
required-features = ["osc"]

[[bench]]
name = "facade"
harness = false
