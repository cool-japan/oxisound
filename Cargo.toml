[workspace]
resolver = "3"
members = [
    "crates/oxisound-core",
    "crates/oxisound-cpal",
    "crates/oxisound",
    "crates/oxisound-midi",
    "crates/oxisound-jack",
    "crates/oxisound-smf",
    "crates/oxisound-osc",
    "crates/oxisound-session",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxisound"
description = "OxiSound is the COOLJAPAN Pure-Rust audio device I/O layer."

[workspace.dependencies]
oxisound-core = { path = "crates/oxisound-core", version = "0.1.3" }
oxisound-cpal = { path = "crates/oxisound-cpal", version = "0.1.3" }
oxisound-midi = { path = "crates/oxisound-midi", version = "0.1.3" }
oxisound-jack = { path = "crates/oxisound-jack", version = "0.1.3" }
oxisound-smf = { path = "crates/oxisound-smf", version = "0.1.3" }
oxisound-osc = { path = "crates/oxisound-osc", version = "0.1.3" }
oxisound-session = { path = "crates/oxisound-session", version = "0.1.3" }
oxiaudio-core = { version = "0.1.3" }
# Bounded FFI: opt-in jack backend (C-FFI/libjack2, requires libjack2 on system)
jack = { version = "0.13.5" }
# Platform-specific: macOS/iOS AVAudioSession bindings via objc2
objc2 = { version = "0.6.4" }
objc2-foundation = { version = "0.3.2" }
objc2-avf-audio = { version = "0.3.2" }
block2 = { version = "0.6.2" }
oxiaudio = { version = "0.1.3" }
midir = "0.11.0"
thiserror = { version = "2.0.18" }
# IMPORTANT: cpal backends (ALSA/CoreAudio/WASAPI) are auto-selected by cfg(target_os).
# There are NO alsa/coreaudio/wasapi features — do NOT add them.
# Real opt-in features: jack, asio, pipewire, pulseaudio.
cpal = { version = "0.17.3", default-features = false }
dasp_sample = "0.11.0"
# Lock-free SPSC ring buffer — Pure Rust (no_std), used in audio callbacks.
ringbuf = { version = "0.5.0" }
tokio = { version = "1.52.3", features = ["sync", "rt", "net", "macros", "time"] }
futures-core = "0.3.32"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
log = "0.4.30"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0" }
